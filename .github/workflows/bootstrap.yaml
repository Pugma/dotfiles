name: Bootstrap

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MISE_IGNORED_CONFIG_PATHS: ~/.config/mise/config.toml
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false

      - name: Create local Git configuration
        run: cp git/config.local.example git/config.local
        shell: bash

      - name: Apply managed dotfiles
        run: mise bootstrap dotfiles apply --force --yes

      - name: Check managed dotfile status
        run: mise bootstrap dotfiles status --missing
