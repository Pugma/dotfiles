[settings]
dotfiles.default_mode = "symlink"
dotfiles.root = "~/develop/dotfiles"

[dotfiles]
"~/.claude/CLAUDE.md" = { source = "agents/CLAUDE-global.md" }
"~/.codex/AGENTS.md" = { source = "agents/AGENTS-global.md" }
"~/.config/mise/config.toml" = { source = "tools/mise-global.toml" }

[tools]
taplo = "latest"

[tasks."fmt:toml"]
description = "Format and reorder TOML files"
run = "taplo fmt"

[tasks."check:toml"]
description = "Check TOML formatting and validity"
run = ["taplo fmt --check", "taplo check"]
