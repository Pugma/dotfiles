min_version = "2026.7.4"

[settings]
dotfiles.default_mode = "symlink"
dotfiles.root = "~/develop/dotfiles"

[dotfiles]
"~/.agents/skills" = { source = "agents/skills" }
"~/.claude/CLAUDE.md" = { source = "agents/CLAUDE-global.md" }
"~/.claude/skills" = { source = "agents/skills" }
"~/.codex/AGENTS.md" = { source = "agents/AGENTS-global.md" }
"~/.config/ghostty/config.ghostty" = { source = "terminal/ghostty.ghostty" }
"~/.config/mise/config.toml" = { source = "tools/mise-global.toml" }
"~/.gitconfig" = { source = "git/config" }
"~/.gitconfig.gitea" = { source = "git/config.gitea" }
"~/.gitconfig.local" = { source = "git/config.local" }

[tools]
taplo = "latest"

[tasks."fmt:toml"]
description = "Format and reorder TOML files"
run = "taplo fmt"

[tasks."check:toml"]
description = "Check TOML formatting and validity"
run = ["taplo fmt --check", "taplo check"]

[tasks."check:dotfiles"]
description = "Check OS-specific dotfile mappings"
run = "uv run --script scripts/check_os_dotfiles.py"

[tasks.check]
depends = ["check:toml", "check:dotfiles"]
description = "Run all checks"
